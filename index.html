<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Page</title>
    
    <style>
        /* Basic reset and typography */
        /* Reset default margins and paddings */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc; /* Light modern gray */
            color: #334155; /* Slate gray text */
            
            /* Centering content using Flexbox */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container for content */
        .container {
            text-align: center;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 600px;
            width: 90%;
        }

        /* Heading styles */
        h1 {
            color: #0f172a; /* Darker slate for heading */
            margin-top: 0;
            font-size: 2.5rem;
        }

        /* Paragraph styles */
        p {
            line-height: 1.6;
            margin-bottom: 0;
            font-size: 1.125rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello, World!</h1>
        <p>This is a simple paragraph with sample text. It demonstrates a clean, modern layout using basic HTML5 structure and custom CSS styling to center elements perfectly on the screen.</p>
    </div>
</body>
</html>
